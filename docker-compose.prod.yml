services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-tokay}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  tokay:
    # Follows the newest stable release. TOKAY_TAG pins an exact version
    # (0.1.0) or an exact build (sha-<commit>) instead.
    image: ghcr.io/tokayops/tokayops:${TOKAY_TAG:-latest}
    restart: unless-stopped
    # Longer than the worker's own drain deadline (60s: the longest a single
    # delivery can take end to end). On SIGTERM the process stops taking new
    # work and then waits for the calls it has already made, so that an answer
    # arriving in the last second is recorded rather than lost - a killed
    # process leaves the delivery ambiguous, and somebody has to decide whether
    # it happened. Docker's default is 10 seconds, which is not enough.
    stop_grace_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Bound to loopback: terminate TLS in a reverse proxy in front of these.
      # Publish on 0.0.0.0 only if you know nothing else can reach the host.
      - "127.0.0.1:${TOKAY_PORT:-8080}:8080"                              # API + UI
      - "127.0.0.1:${INTERNAL_PORT:-9090}:${INTERNAL_PORT:-9090}"         # Health + Prometheus metrics
    env_file: .env
    environment:
      # Pinned to the bundled service, and deliberately not substitutable:
      # .env.example ships DB_HOST=localhost for running the binary on the host,
      # which inside this container would point at the container itself.
      # `environment` beats `env_file`, so DB_HOST in .env has no effect here -
      # to use an external Postgres, edit these two lines and drop the postgres
      # service along with the depends_on below.
      DB_HOST: postgres
      DB_PORT: 5432
    # The image ships a default tokay.yaml. To override it, uncomment the mount
    # below and put your own tokay.yaml next to this file - creating the mount
    # without the file makes Docker create a directory and the container exits.
    # volumes:
    #   - ./tokay.yaml:/app/tokay.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${INTERNAL_PORT:-9090}/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
