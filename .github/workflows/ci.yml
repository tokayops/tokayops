name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'epic*'
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    # The whole tree, not the files a PR touched. A diff-scoped gate needs
    # fetch-depth: 0 and a different base for push and pull_request, and it
    # only pays for itself when the baseline is dirty - this one is clean, so
    # the blunt check is both cheaper and stricter.
    - name: Check formatting
      run: |
        unformatted=$(gofmt -l ./cmd ./internal)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-clean:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: Run tests with coverage
      run: go test ./... -v -coverprofile=coverage.out

    - name: Display coverage
      run: go tool cover -func=coverage.out | tail -1

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v5
      with:
        name: coverage-report
        path: coverage.out

  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_tokay
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_tokay"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    - name: Run integration tests
      env:
        TEST_DB_DSN: postgres://test_user:test_password@localhost:5433/test_tokay?sslmode=disable
        ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      run: go test -p 1 -tags=integration -v ./internal/...

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, integration-test]  # Run both test jobs first
    permissions:
      contents: read
      packages: write   # push images to GHCR via GITHUB_TOKEN
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Determine Docker tag
      id: docker_tag
      run: |
        if [ "${{ github.ref }}" == "refs/heads/main" ]; then
          echo "tag=latest" >> $GITHUB_OUTPUT
        else
          echo "tag=develop" >> $GITHUB_OUTPUT
        fi

    - name: Build and push Tokay
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        build-args: |
          GIT_COMMIT=${{ github.sha }}
          GIT_BRANCH=${{ github.ref_name }}
        tags: |
          ghcr.io/tokayops/tokayops:${{ steps.docker_tag.outputs.tag }}
          ghcr.io/tokayops/tokayops:sha-${{ github.sha }}

    - name: Build and push Webhook Receiver
      uses: docker/build-push-action@v5
      with:
        context: .
        file: cmd/webhook-receiver/Dockerfile
        push: true
        tags: |
          ghcr.io/tokayops/webhook-receiver:${{ steps.docker_tag.outputs.tag }}
          ghcr.io/tokayops/webhook-receiver:sha-${{ github.sha }}
