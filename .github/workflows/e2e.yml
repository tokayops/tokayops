name: E2E Tests

on:
  push:
    branches: [main, feature/*, feat/*, fix/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Start E2E environment
        run: |
          docker compose -f docker-compose.e2e.yml up -d --build

          # Wait for the app to be healthy
          echo "Waiting for application to be ready..."
          MAX_ATTEMPTS=60
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if curl -s http://localhost:8081/swagger/index.html > /dev/null 2>&1; then
              echo "Application is ready!"
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "Waiting for app... (attempt $ATTEMPT/$MAX_ATTEMPTS)"
            sleep 2
          done

          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "Application failed to start"
            docker compose -f docker-compose.e2e.yml logs tokay_app
            exit 1
          fi

      - name: Create test user and seed data
        run: |
          docker compose -f docker-compose.e2e.yml exec -T tokay_app /app/tokayops user create admin@example.com 'Admin123!' 'Test Admin' || true
          docker compose -f docker-compose.e2e.yml exec -T tokay_app /app/tokayops seed || true

      - name: Run E2E tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8081
          TEST_USER_EMAIL: admin@example.com
          TEST_USER_PASSWORD: 'Admin123!'
          CI: true
        run: npx playwright test --project=chromium

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload test artifacts
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans
