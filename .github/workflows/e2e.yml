name: E2E Tests

on:
  push:
    branches: [main, feature/*, feat/*, fix/*, 'epic*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      # Build, wait and seed come from the Makefile, which is where the E2E
      # environment is defined. This step used to keep its own copy of the
      # sequence, and when the destructive schedule reset became part of the
      # environment the copy never got it: `env.spec.ts` failed here on every
      # branch while `make e2e-test` was green locally. Calling the targets is
      # what keeps the two from drifting again.
      - name: Start E2E environment
        run: make e2e-up

      - name: Run E2E tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8081
          TEST_USER_EMAIL: admin@example.com
          TEST_USER_PASSWORD: 'Admin123!'
          CI: true
        run: npx playwright test --project=chromium

      - name: Upload test results
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload test artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: failure()
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans
