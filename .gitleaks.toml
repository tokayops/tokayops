# Gitleaks configuration
# https://github.com/gitleaks/gitleaks

[extend]
useDefault = true

# Global allowlist
[allowlist]
description = "Exclude documentation examples, test files, and dummy secrets in CI/e2e configs"
paths = [
  '''README\.md$''',
  '''docs/.*\.md$''',
  '''.*_test\.go$''',
  '''testdata/.*''',
  # Dummy ENCRYPTION_KEY of the e2e stack - not a real secret; the workflows generate theirs
  '''docker-compose\.e2e\.yml$''',
]
