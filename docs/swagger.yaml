          description: OK
          schema:
            $ref: '#/definitions/model.UserWithPermissions'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get current user
      tags:
      - auth
    patch:
      consumes:
      - application/json
      description: Update the current user's name. SSO users cannot change their name.
      parameters:
      - description: Profile updates
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/api.UpdateMeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Update current user profile
      tags:
      - auth
  /api/auth/me/slack:
    delete:
      consumes:
      - application/json
      description: Remove the Slack identity binding from the current user
      produces:
      - application/json
