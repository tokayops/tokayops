basePath: /
definitions:
  api.APITokenListItem:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      last_used_at:
        type: string
      name:
        type: string
    type: object
  api.APITokenListResponse:
    properties:
      tokens:
        items:
          $ref: '#/definitions/api.APITokenListItem'
        type: array
      total:
        type: integer
    type: object
  api.AddNoteRequest:
    properties:
      actor:
        description: Optional, defaults to "user"
        type: string
      message:
        description: Required
        type: string
    type: object
  api.AddTeamMemberRequest:
    properties:
      role:
        description: Optional, defaults to "member"
        type: string
      user_id:
        description: Required
        type: string
    type: object
  api.AlertGroupListResponse:
    properties:
      alert_groups:
        items:
          $ref: '#/definitions/model.AlertGroup'
        type: array
      incidents:
        description: Legacy
        items:
          $ref: '#/definitions/model.AlertGroup'
        type: array
      total:
        type: integer
    type: object
  api.ConfirmSlackCodeRequest:
    properties:
      code:
        type: string
    type: object
  api.CreateAPITokenRequest:
    properties:
      expires_in:
        description: 'Optional: expiration in days (nil = no expiration)'
        type: integer
      name:
        description: 'Required: descriptive name for the token'
        type: string
    type: object
  api.CreateAPITokenResponse:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      name:
        type: string
      token:
        description: Plain token - shown ONCE
        type: string
    type: object
  api.CreateIntegrationRequest:
    properties:
      config:
        type: object
      enabled:
        description: Pointer to detect if provided (defaults to true)
        type: boolean
      name:
        type: string
      scope:
        allOf:
        - $ref: '#/definitions/model.WebhookScope'
        description: Required for generic_webhook
      team_id:
        description: Required when scope=team
        type: string
      type:
        $ref: '#/definitions/model.IntegrationType'
    type: object
  api.CreateTeamRequest:
    properties:
      description:
        description: Optional
        type: string
      id:
        description: Required
        type: string
      name:
        description: Required
        type: string
    type: object
  api.CreateUserRequest:
    properties:
      email:
        description: Required
        type: string
      id:
        description: Optional, will be generated if not provided
        type: string
      name:
        description: Required
        type: string
      password:
        description: Optional, will be hashed if provided
        type: string
      role:
        description: 'Optional: "admin" or "user"'
        type: string
    type: object
  api.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  api.IntegrationListResponse:
    properties:
      integrations:
        items:
          $ref: '#/definitions/model.Integration'
        type: array
      total:
        type: integer
    type: object
  api.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  api.ManualAlertGroupRequest:
    properties:
      severity:
        type: string
      team_id:
        type: string
      title:
        type: string
    type: object
  api.OIDCConfigResponse:
    properties:
      enabled:
        type: boolean
      login_url:
        type: string
    type: object
  api.OverrideRequest:
    properties:
      end_time:
        description: 'Legacy: UTC or offset-included time'
        type: string
      end_time_local:
        description: 'Optional: "2006-01-02T15:04"'
        type: string
      reason:
        description: Optional reason
        type: string
      start_time:
        description: 'Legacy: UTC or offset-included time'
        type: string
      start_time_local:
        description: 'Optional: "2006-01-02T15:04"'
        type: string
      timezone:
        description: 'Optional: Timezone for local times'
        type: string
      user_id:
        description: User to assign
        type: string
    type: object
  api.PolicyRequest:
    properties:
      description:
        type: string
      name:
        type: string
      steps:
        items:
          $ref: '#/definitions/api.PolicyStepRequest'
        type: array
      team_id:
        description: nil = global
        type: string
    type: object
  api.PolicyStepRequest:
    properties:
      continue_on_failure:
        description: nil defaults to true
        type: boolean
      delay_seconds:
        type: integer
      max_attempts:
        type: integer
      message:
        type: string
      provider:
        description: '"slack", "telegram", ...'
        type: string
      target_id:
        type: string
      target_kind:
        description: '"dm" | "channel"'
        type: string
      target_type:
        description: user, channel, schedule
        type: string
      timeout_seconds:
        type: integer
    type: object
  api.ProviderCapability:
    properties:
      integration_type:
        $ref: '#/definitions/model.IntegrationType'
      name:
        type: string
      supported_target_kinds:
        items:
          type: string
        type: array
    type: object
  api.ProvidersResponse:
    properties:
      providers:
        items:
          $ref: '#/definitions/api.ProviderCapability'
        type: array
    type: object
  api.RenderEntry:
    properties:
      end_time:
        type: string
      layer:
        description: '"l1", "l2", "override"'
        type: string
      override_end:
        type: string
      override_id:
        description: Override-specific fields (only set when Layer == "override")
        type: string
      override_start:
        type: string
      reason:
        type: string
      schedule_id:
        type: string
      start_time:
        type: string
      user_ids:
        items:
          type: string
        type: array
      user_names:
        items:
          type: string
        type: array
    type: object
  api.RequestSlackCodeRequest:
    properties:
      slack_user_id:
        type: string
    type: object
  api.ScheduleRequest:
    properties:
      l1_handoff_day:
        description: 0=Sun, 1=Mon
        type: integer
      l1_handoff_time:
        description: '"11:00"'
        type: string
      l1_rotation_start:
        description: e.g., 2025-01-01T11:00:00Z
        type: string
      l1_rotation_type:
        description: '"daily" | "weekly"'
        type: string
      l2_enabled:
        description: Enable L2 layer
        type: boolean
      l2_escalation_timeout:
        description: Minutes before escalating
        type: integer
      l2_handoff_day:
        type: integer
      l2_handoff_time:
        type: string
      l2_rotation_start:
        type: string
      l2_rotation_type:
        type: string
      slack_usergroup_id:
        description: Optional Slack usergroup for on-call sync
        type: string
      timezone:
        description: IANA timezone
        type: string
    type: object
  api.SetGroupsRequest:
    properties:
      groups:
        description: Groups of user IDs, e.g. [["id1","id2"],["id3"]]
        items:
          items:
            type: string
          type: array
        type: array
    type: object
  api.SetUsersRequest:
    properties:
      user_ids:
        description: Ordered list of user IDs (L2 only)
        items:
          type: string
        type: array
    type: object
  api.TeamListResponse:
    properties:
      teams:
        items:
          $ref: '#/definitions/api.TeamWithConfig'
        type: array
      total:
        type: integer
    type: object
  api.TeamMemberListResponse:
    properties:
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/model.TeamMemberDetail'
        type: array
    type: object
  api.TeamWithConfig:
    properties:
      created_at:
        type: string
      default_policy_id:
        description: Fallback escalation policy
        type: string
      description:
        description: Optional description
        type: string
      id:
        description: e.g., "devops"
        type: string
      member_count:
        type: integer
      name:
        description: 'Display name: "DevOps Team"'
        type: string
      on_call_configured:
        type: boolean
      severity_routes:
        additionalProperties:
          type: string
        description: severity -> policy_id
        type: object
    type: object
  api.TestIntegrationRequest:
    properties:
      mode:
        description: '"dm" for direct message test'
        type: string
    type: object
  api.TestIntegrationResponse:
    properties:
      message:
        type: string
      ok:
        type: boolean
    type: object
  api.TimelineResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/model.TimelineEvent'
        type: array
      total:
        type: integer
    type: object
  api.UpdateIntegrationRequest:
    properties:
      config:
        type: object
      enabled:
        type: boolean
      name:
        type: string
    type: object
  api.UpdateMeRequest:
    properties:
      name:
        type: string
    type: object
  api.UpdatePasswordRequest:
    properties:
      password:
        type: string
    type: object
  api.UpdateTeamRequest:
    properties:
      default_policy_id:
        type: string
      description:
        type: string
      name:
        type: string
      severity_routes:
        additionalProperties:
          type: string
        type: object
    type: object
  api.UpdateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      role:
        description: 'Optional: "admin" or "user"'
        type: string
    type: object
  api.UserListResponse:
    properties:
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/model.User'
        type: array
    type: object
  model.Alert:
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      endsAt:
        type: string
      fingerprint:
        type: string
      generatorURL:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      startsAt:
        type: string
      status:
        $ref: '#/definitions/model.AlertStatus'
    type: object
  model.AlertGroup:
    properties:
      ack_processed_at:
        description: When ack update job was processed
        type: string
      acknowledged_by:
        description: Acknowledgement
        type: string
      alerts:
        description: Alerts Snapshot
        items:
          $ref: '#/definitions/model.Alert'
        type: array
      created_at:
        type: string
      current_step:
        type: integer
      dedup_key:
        description: groupKey from Alertmanager (fingerprint)
        type: string
      external_url:
        description: External Link to Alertmanager Source (for clickable titles)
        type: string
      id:
        description: UUID
        type: string
      incident_id:
        description: Link to future Incident (NULL in most cases for Phase 2)
        type: integer
      oncall_snapshot:
        allOf:
        - $ref: '#/definitions/model.OnCallResult'
        description: OnCall Snapshot (stores the on-call state at the time of alert
          group creation)
      policy_id:
        description: Escalation Logic
        type: string
      policy_snapshot:
        allOf:
        - $ref: '#/definitions/model.EscalationPolicySnapshot'
        description: Policy Snapshot (stores the policy state at the time of creation/assignment)
      resolved_at:
        type: string
      resolved_by:
        type: string
      severity:
        type: string
      slack_update_pending:
        description: Slack Update Tracking
        type: boolean
      status:
        $ref: '#/definitions/model.AlertGroupStatus'
      team_id:
        description: Classification
        type: string
      team_name_snapshot:
        type: string
      timeline_events:
        description: Timeline (loaded on demand, not persisted here)
        items:
          $ref: '#/definitions/model.TimelineEvent'
        type: array
      title:
        description: Derived from Alert Labels/Annotations
        type: string
      updated_at:
        type: string
    type: object
  model.AlertGroupStatus:
    enum:
    - new
    - processing
    - triggered
    - acknowledged
    - resolved
    - closed
    type: string
    x-enum-comments:
      AlertGroupStatusAcknowledged: User acknowledged, waiting for resolution
    x-enum-varnames:
    - AlertGroupStatusNew
    - AlertGroupStatusProcessing
    - AlertGroupStatusTriggered
    - AlertGroupStatusAcknowledged
    - AlertGroupStatusResolved
    - AlertGroupStatusClosed
  model.AlertStatus:
    enum:
    - firing
    - resolved
    type: string
    x-enum-varnames:
    - AlertStatusFiring
    - AlertStatusResolved
  model.EscalationPolicy:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      steps:
        items:
          $ref: '#/definitions/model.EscalationStep'
        type: array
      team_id:
        description: nil = global policy
        type: string
      updated_at:
        type: string
    type: object
  model.EscalationPolicySnapshot:
    properties:
      name:
        type: string
      policy_id:
        description: Effective policy ID (empty if firehose-only fallback)
        type: string
      steps:
        items:
          $ref: '#/definitions/model.EscalationStepSnapshot'
        type: array
    type: object
  model.EscalationStep:
    properties:
      continue_on_failure:
        type: boolean
      delay_seconds:
        type: integer
      id:
        type: string
      max_attempts:
        type: integer
      message:
        type: string
      policy_id:
        type: string
      provider:
        description: '"slack", "telegram", ...'
        type: string
      step_index:
        type: integer
      target_id:
        description: actual ID
        type: string
      target_kind:
        description: '"dm" | "channel"'
        type: string
      target_type:
        description: user, channel, schedule
        type: string
      timeout_seconds:
        type: integer
    type: object
  model.EscalationStepSnapshot:
    properties:
      is_firehose:
        description: true for firehose step
        type: boolean
      provider:
        type: string
      stage_index:
        description: which stage this step belongs to
        type: integer
      target_id:
        type: string
      target_kind:
        type: string
      target_type:
        type: string
    type: object
  model.ExternalIdentity:
    properties:
      chat_id:
        description: provider-specific (Telegram DM chat)
        type: string
      created_at:
        type: string
      display_name:
        description: shown in timeline / UI
        type: string
      external_id:
        type: string
      id:
        type: string
      provider:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  model.Integration:
    properties:
      config:
        type: object
      created_at:
        type: string
      direction:
        $ref: '#/definitions/model.IntegrationDirection'
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      scope:
        $ref: '#/definitions/model.WebhookScope'
      team_id:
        type: string
      type:
        $ref: '#/definitions/model.IntegrationType'
      updated_at:
        type: string
    type: object
  model.IntegrationDirection:
    enum:
    - inbound
    - outbound
    type: string
    x-enum-varnames:
    - IntegrationDirectionInbound
    - IntegrationDirectionOutbound
  model.IntegrationType:
    enum:
    - slack
    - telegram
    - alertmanager_webhook
    - generic_webhook
    type: string
    x-enum-varnames:
    - IntegrationTypeSlack
    - IntegrationTypeTelegram
    - IntegrationTypeAlertmanagerWebhook
    - IntegrationTypeGenericWebhook
  model.OnCallResult:
    properties:
      l1_since:
        description: When L1 shift started
        type: string
      l1_until:
        description: When L1 shift ends. nil = forever/unknown
        type: string
      l1_users:
        items:
          $ref: '#/definitions/model.User'
        type: array
      l2_user:
        $ref: '#/definitions/model.User'
      override:
        allOf:
        - $ref: '#/definitions/model.ScheduleOverride'
        description: If override is active
    type: object
  model.RotationType:
    enum:
    - daily
    - weekly
    type: string
    x-enum-varnames:
    - RotationDaily
    - RotationWeekly
  model.Schedule:
    properties:
      created_at:
        type: string
      id:
        type: string
      l1_groups:
        items:
          items:
            $ref: '#/definitions/model.User'
          type: array
        type: array
      l1_handoff_day:
        description: 0=Sun, 1=Mon (for weekly)
        type: integer
      l1_handoff_time:
        description: '"11:00" format'
        type: string
      l1_rotation_start:
        description: When rotation started
        type: string
      l1_rotation_type:
        allOf:
        - $ref: '#/definitions/model.RotationType'
        description: L1 Layer Config (Primary)
      l2_enabled:
        description: L2 Layer Config (Secondary, optional)
        type: boolean
      l2_escalation_timeout_min:
        description: Minutes before escalating to L2
        type: integer
      l2_handoff_day:
        type: integer
      l2_handoff_time:
        type: string
      l2_rotation_start:
        type: string
      l2_rotation_type:
        $ref: '#/definitions/model.RotationType'
      l2_users:
        items:
          $ref: '#/definitions/model.User'
        type: array
      overrides:
        items:
          $ref: '#/definitions/model.ScheduleOverride'
        type: array
      slack_usergroup_id:
        description: Slack Usergroup Sync (optional)
        type: string
      team_id:
        type: string
      timezone:
        description: IANA timezone, e.g., "Asia/Bangkok"
        type: string
      updated_at:
        type: string
    type: object
  model.ScheduleOverride:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      end_time:
        type: string
      id:
        type: string
      reason:
        type: string
      schedule_id:
        type: string
      start_time:
        description: Minute precision
        type: string
      user:
        allOf:
        - $ref: '#/definitions/model.User'
        description: Populated on read
      user_id:
        type: string
    type: object
  model.Team:
    properties:
      created_at:
        type: string
      default_policy_id:
        description: Fallback escalation policy
        type: string
      description:
        description: Optional description
        type: string
      id:
        description: e.g., "devops"
        type: string
      name:
        description: 'Display name: "DevOps Team"'
        type: string
      severity_routes:
        additionalProperties:
          type: string
        description: severity -> policy_id
        type: object
    type: object
  model.TeamMember:
    properties:
      role:
        $ref: '#/definitions/model.TeamMemberRole'
      team_id:
        type: string
      user_id:
        type: string
    type: object
  model.TeamMemberDetail:
    properties:
      auth_provider:
        description: '"password" or "oidc" - last login method'
        type: string
      created_at:
        type: string
      email:
        description: Unique email
        type: string
      id:
        description: UUID
        type: string
      identities:
        description: loaded on demand by handlers
        items:
          $ref: '#/definitions/model.ExternalIdentity'
        type: array
      name:
        description: Display name
        type: string
      role:
        allOf:
        - $ref: '#/definitions/model.UserRole'
        description: 'Global role: admin or user'
      team_role:
        allOf:
        - $ref: '#/definitions/model.TeamMemberRole'
        description: '"team_admin" or "team_member"'
    type: object
  model.TeamMemberRole:
    enum:
    - team_admin
    - team_member
    type: string
    x-enum-comments:
      TeamMemberRoleAdmin: Team administrator
      TeamMemberRoleMember: Regular team member
    x-enum-varnames:
    - TeamMemberRoleAdmin
    - TeamMemberRoleMember
  model.TimelineEvent:
    properties:
      actor:
        description: User ID, "system", or alert name
        type: string
      alert_group_id:
        description: Changed from incident_id
        type: string
      created_at:
        type: string
      id:
        type: string
      message:
        description: Human-readable description
        type: string
      metadata:
        additionalProperties:
          type: string
        description: Extra data (alert fingerprint, etc.)
        type: object
      type:
        $ref: '#/definitions/model.TimelineEventType'
    type: object
  model.TimelineEventType:
    enum:
    - created
    - alert_added
    - alert_resolved
    - acknowledged
    - resolved
    - notification_sent
    - notification_failed
    - note
    - status_change
    type: string
    x-enum-varnames:
    - TimelineEventCreated
    - TimelineEventAlertAdded
    - TimelineEventAlertResolved
    - TimelineEventAcknowledged
    - TimelineEventResolved
    - TimelineEventNotificationSent
    - TimelineEventNotificationFailed
    - TimelineEventNote
    - TimelineEventStatusChange
  model.User:
    properties:
      auth_provider:
        description: '"password" or "oidc" - last login method'
        type: string
      created_at:
        type: string
      email:
        description: Unique email
        type: string
      id:
        description: UUID
        type: string
      identities:
        description: loaded on demand by handlers
        items:
          $ref: '#/definitions/model.ExternalIdentity'
        type: array
      name:
        description: Display name
        type: string
      role:
        allOf:
        - $ref: '#/definitions/model.UserRole'
        description: 'Global role: admin or user'
    type: object
  model.UserRole:
    enum:
    - admin
    - user
    type: string
    x-enum-comments:
      UserRoleAdmin: Full system access
      UserRoleUser: Standard authenticated user (default)
    x-enum-varnames:
    - UserRoleAdmin
    - UserRoleUser
  model.UserWithPermissions:
    properties:
      auth_provider:
        description: '"password" or "oidc" - last login method'
        type: string
      created_at:
        type: string
      email:
        description: Unique email
        type: string
      id:
        description: UUID
        type: string
      identities:
        description: loaded on demand by handlers
        items:
          $ref: '#/definitions/model.ExternalIdentity'
        type: array
      name:
        description: Display name
        type: string
      role:
        allOf:
        - $ref: '#/definitions/model.UserRole'
        description: 'Global role: admin or user'
      teams:
        additionalProperties:
          $ref: '#/definitions/model.TeamMemberRole'
        description: Teams is a map of TeamID to Role (e.g. "devops" -> "team_admin")
        type: object
    type: object
  model.WebhookScope:
    enum:
    - global
    - team
    type: string
    x-enum-varnames:
    - WebhookScopeGlobal
    - WebhookScopeTeam
info:
  contact: {}
  description: TokayOps API
  title: TokayOps API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and set HTTPOnly cookie
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/api.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Login
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Clear authentication cookie
      responses:
        "200":
          description: OK
      summary: Logout
      tags:
      - auth
  /api/auth/me:
    get:
      description: Get currently authenticated user details
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UserWithPermissions'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get current user
      tags:
      - auth
    patch:
      consumes:
      - application/json
      description: Update the current user's name. SSO users cannot change their name.
      parameters:
      - description: Profile updates
