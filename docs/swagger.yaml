      - application/json
      description: Verify the OTP code and bind the Slack account
      parameters:
      - description: Confirm data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ConfirmSlackCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Confirm Slack OTP code
      tags:
      - auth
  /api/auth/me/slack/request-code:
    post:
      consumes:
      - application/json
      description: Send an OTP code to the specified Slack User ID via DM
      parameters:
      - description: Request data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.RequestSlackCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
