basePath: /
definitions:
  api.APITokenListItem:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      last_used_at:
        type: string
      name:
        type: string
    type: object
  api.APITokenListResponse:
    properties:
      tokens:
        items:
          $ref: '#/definitions/api.APITokenListItem'
        type: array
      total:
        type: integer
    type: object
  api.AddNoteRequest:
    properties:
      actor:
        description: Optional, defaults to "user"
        type: string
      message:
        description: Required
        type: string
    type: object
  api.AddTeamMemberRequest:
    properties:
      role:
        description: Optional, defaults to "member"
        type: string
      user_id:
        description: Required
        type: string
    type: object
  api.AlertGroupListResponse:
    properties:
      alert_groups:
        items:
          $ref: '#/definitions/model.AlertGroup'
        type: array
      incidents:
        description: Legacy
        items:
          $ref: '#/definitions/model.AlertGroup'
        type: array
      total:
        type: integer
    type: object
  api.ConfirmSlackCodeRequest:
    properties:
      code:
        type: string
    type: object
  api.CreateAPITokenRequest:
    properties:
      expires_in:
        description: 'Optional: expiration in days (nil = no expiration)'
        type: integer
      name:
        description: 'Required: descriptive name for the token'
        type: string
    type: object
  api.CreateAPITokenResponse:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      name:
        type: string
      token:
        description: Plain token - shown ONCE
        type: string
    type: object
  api.CreateIntegrationRequest:
    properties:
      config:
        type: object
      enabled:
        description: Pointer to detect if provided (defaults to true)
        type: boolean
      name:
        type: string
      scope:
        allOf:
        - $ref: '#/definitions/model.WebhookScope'
        description: Required for generic_webhook
      team_id:
        description: Required when scope=team
        type: string
      type:
        $ref: '#/definitions/model.IntegrationType'
    type: object
  api.CreateTeamRequest:
    properties:
      description:
        description: Optional
        type: string
      id:
        description: Required
        type: string
      name:
        description: Required
        type: string
    type: object
  api.CreateUserRequest:
    properties:
      email:
        description: Required
        type: string
      id:
        description: Optional, will be generated if not provided
        type: string
      name:
        description: Required
        type: string
      password:
        description: Optional, will be hashed if provided
        type: string
      role:
        description: 'Optional: "admin" or "user"'
        type: string
    type: object
  api.ErrorResponse:
    properties:
      code:
        type: string
      error:
        type: string
    type: object
  api.IntegrationListResponse:
    properties:
      integrations:
        items:
          $ref: '#/definitions/model.Integration'
        type: array
      total:
        type: integer
    type: object
  api.LayerOnCallDTO:
    properties:
      assignment_end:
        type: string
      assignment_start:
        type: string
      grid_slot_end:
        type: string
      grid_slot_start:
        type: string
      group_id:
        type: string
      override_id:
        type: string
      revision_id:
        type: string
      source:
        description: rotation | override
        type: string
      user_ids:
        items:
          type: string
        type: array
    type: object
  api.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  api.ManualAlertGroupRequest:
    properties:
      severity:
        type: string
      team_id:
        type: string
      title:
        type: string
    type: object
  api.OIDCConfigResponse:
    properties:
      enabled:
        type: boolean
      login_url:
        type: string
    type: object
  api.OnCallDTO:
    properties:
      at:
        type: string
      l1:
        $ref: '#/definitions/api.LayerOnCallDTO'
      l2:
        $ref: '#/definitions/api.LayerOnCallDTO'
      warnings:
        items:
          $ref: '#/definitions/api.ScheduleWarningDTO'
        type: array
    type: object
  api.PolicyRequest:
    properties:
      description:
        type: string
      name:
        type: string
      steps:
        items:
          $ref: '#/definitions/api.PolicyStepRequest'
        type: array
      team_id:
        description: nil = global
        type: string
    type: object
  api.PolicyStepRequest:
    properties:
      continue_on_failure:
        description: nil defaults to true
        type: boolean
      delay_seconds:
        type: integer
      max_attempts:
        type: integer
      message:
        type: string
      provider:
        description: '"slack", "telegram", ...'
        type: string
      target_id:
        type: string
      target_kind:
        description: '"dm" | "channel"'
        type: string
      target_type:
        description: user, channel, schedule
        type: string
      timeout_seconds:
        type: integer
    type: object
  api.ProviderCapability:
    properties:
      integration_type:
        $ref: '#/definitions/model.IntegrationType'
      name:
        type: string
      supported_target_kinds:
        items:
          type: string
        type: array
    type: object
  api.ProvidersResponse:
    properties:
      providers:
        items:
          $ref: '#/definitions/api.ProviderCapability'
        type: array
    type: object
  api.PutScheduleConfigRequest:
    properties:
      expected_version:
        description: |-
          ExpectedVersion is the config_version the editor loaded. Zero means
          "there is no schedule yet"; anything else must match or the save is
          rejected with the current version.
        type: integer
      l1:
        $ref: '#/definitions/api.ScheduleL1DTO'
      l2:
        $ref: '#/definitions/api.ScheduleL2DTO'
      reason:
        description: Reason is free text recorded with the revision.
        type: string
      slack_usergroup_id:
        type: string
      timezone:
        type: string
    type: object
  api.PutScheduleConfigResponse:
    properties:
      created:
        type: boolean
      noop:
        type: boolean
      on_call_after:
        $ref: '#/definitions/api.OnCallDTO'
      recreated:
        type: boolean
      revision_id:
        type: string
      version:
        type: integer
    type: object
  api.RequestSlackCodeRequest:
    properties:
      slack_user_id:
        type: string
    type: object
  api.ResolveUsersRequest:
    properties:
      user_ids:
        items:
          type: string
        type: array
    type: object
  api.ResolveUsersResponse:
    properties:
      users:
        items:
          $ref: '#/definitions/api.ResolvedUserDTO'
        type: array
    type: object
  api.ResolvedUserDTO:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  api.ScheduleConfigDTO:
    properties:
      l1:
        $ref: '#/definitions/api.ScheduleL1DTO'
      l2:
        $ref: '#/definitions/api.ScheduleL2DTO'
      slack_usergroup_id:
        type: string
      timezone:
        type: string
    type: object
  api.ScheduleConfigResponse:
    properties:
      config:
        $ref: '#/definitions/api.ScheduleConfigDTO'
      deleted_at:
        type: string
      effective_from:
        type: string
      revision_id:
        type: string
      schedule_id:
        type: string
      version:
        type: integer
    type: object
  api.ScheduleGroupDTO:
    properties:
      id:
        type: string
      user_ids:
        items:
          type: string
        type: array
    type: object
  api.ScheduleL1DTO:
    properties:
      enabled:
        type: boolean
      groups:
        items:
          $ref: '#/definitions/api.ScheduleGroupDTO'
        type: array
      handoff_day:
        description: weekly only, 0=Sunday
        type: integer
      handoff_time:
        description: local "HH:MM"
        type: string
      rotation_type:
        description: daily | weekly
        type: string
    type: object
  api.ScheduleL2DTO:
    properties:
      enabled:
        type: boolean
      escalation_timeout_minutes:
        type: integer
      handoff_day:
        type: integer
      handoff_time:
        type: string
      rotation_type:
        type: string
      user_ids:
        items:
          type: string
        type: array
    type: object
  api.ScheduleOnCallResponse:
    properties:
      deleted_at:
        type: string
      on_call:
        $ref: '#/definitions/api.OnCallDTO'
      schedule_id:
        type: string
    type: object
  api.ScheduleOverrideDTO:
    properties:
      override_id:
        type: string
      reason:
        type: string
      recorded_at:
        type: string
      recorded_by:
        type: string
      revision:
        type: integer
      user_id:
        type: string
      valid_from:
        type: string
      valid_to:
        type: string
    type: object
  api.ScheduleOverrideListResponse:
    properties:
      overrides:
        items:
          $ref: '#/definitions/api.ScheduleOverrideDTO'
        type: array
    type: object
  api.ScheduleOverrideRequest:
    properties:
      expected_revision:
        type: integer
      reason:
        type: string
      user_id:
        type: string
      valid_from:
        type: string
      valid_to:
        type: string
    type: object
  api.SchedulePreviewResponse:
    properties:
      base_version:
        type: integer
      entries:
        items:
          $ref: '#/definitions/api.ShiftDTO'
        type: array
      evaluated_at:
        type: string
      on_call_after:
        $ref: '#/definitions/api.OnCallDTO'
      on_call_before:
        $ref: '#/definitions/api.OnCallDTO'
      on_call_changed:
        type: boolean
      warnings:
        items:
          $ref: '#/definitions/api.ScheduleWarningDTO'
        type: array
    type: object
  api.ScheduleRenderResponse:
    properties:
      deleted_at:
        type: string
      entries:
        items:
          $ref: '#/definitions/api.ShiftDTO'
        type: array
      from:
        type: string
      history_complete:
        description: |-
          HistoryComplete is false when part of the range precedes the point from
          which this schedule's history is exact. Inferred history is never
          returned as if it had been recorded.
        type: boolean
      history_complete_from:
        type: string
      until:
        type: string
      warnings:
        items:
          $ref: '#/definitions/api.ScheduleWarningDTO'
        type: array
    type: object
  api.ScheduleRevisionDTO:
    properties:
      change_reason:
        type: string
      change_summary:
        $ref: '#/definitions/rotation.ChangeSummary'
      config:
        $ref: '#/definitions/api.ScheduleConfigDTO'
      created_by:
        type: string
      effective_from:
        type: string
      effective_to:
        type: string
      kind:
        description: active | deleted
        type: string
      recorded_at:
        type: string
      revision_id:
        type: string
      version:
        type: integer
    type: object
  api.ScheduleRevisionListResponse:
    properties:
      next_before_version:
        description: |-
          NextBeforeVersion is the cursor for the following page, absent when this
          page is the end. A version cursor rather than an offset: versions are
          dense and strictly increasing, so a page cannot shift under a reader.
        type: integer
      revisions:
        items:
          $ref: '#/definitions/api.ScheduleRevisionDTO'
        type: array
    type: object
  api.ScheduleWarningDTO:
    properties:
      code:
        type: string
      from:
        type: string
      layer:
        type: string
      related_ids:
        items:
          type: string
        type: array
      until:
        type: string
    type: object
  api.ShiftDTO:
    properties:
      end:
        type: string
      grid_slot_end:
        type: string
      grid_slot_start:
        type: string
      group_id:
        type: string
      layer:
        type: string
      override_id:
        type: string
      override_revision_id:
        type: string
      revision_ids:
        description: 'RevisionIDs is provenance: which revisions contributed, in order.'
        items:
          type: string
        type: array
      slot_count:
        description: SlotCount is how many grid slots this shift spans.
        type: integer
      source:
        type: string
      start:
        type: string
      user_ids:
        items:
          type: string
        type: array
    type: object
  api.TeamListResponse:
    properties:
      teams:
        items:
          $ref: '#/definitions/api.TeamWithConfig'
        type: array
      total:
        type: integer
    type: object
  api.TeamMemberListResponse:
    properties:
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/model.TeamMemberDetail'
        type: array
    type: object
  api.TeamWithConfig:
    properties:
      created_at:
        type: string
      default_policy_id:
        description: Fallback escalation policy
        type: string
      description:
        description: Optional description
        type: string
      id:
        description: e.g., "devops"
        type: string
      member_count:
        type: integer
      name:
        description: 'Display name: "DevOps Team"'
        type: string
      on_call_configured:
        type: boolean
      severity_routes:
        additionalProperties:
          type: string
        description: severity -> policy_id
        type: object
    type: object
  api.TestIntegrationRequest:
    properties:
      mode:
        description: '"dm" for direct message test'
        type: string
    type: object
  api.TestIntegrationResponse:
    properties:
      message:
        type: string
      ok:
        type: boolean
    type: object
  api.TimelineResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/model.TimelineEvent'
        type: array
      total:
        type: integer
    type: object
  api.UpdateIntegrationRequest:
    properties:
      config:
        type: object
      enabled:
        type: boolean
      name:
        type: string
    type: object
  api.UpdateMeRequest:
    properties:
      name:
        type: string
    type: object
  api.UpdatePasswordRequest:
    properties:
      password:
        type: string
    type: object
  api.UpdateTeamRequest:
    properties:
      default_policy_id:
        type: string
      description:
        type: string
      name:
        type: string
      severity_routes:
        additionalProperties:
          type: string
        type: object
    type: object
  api.UpdateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      role:
        description: 'Optional: "admin" or "user"'
        type: string
    type: object
  api.UserListResponse:
    properties:
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/model.User'
        type: array
    type: object
  model.Alert:
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      endsAt:
        type: string
      fingerprint:
        type: string
      generatorURL:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      startsAt:
        type: string
      status:
        $ref: '#/definitions/model.AlertStatus'
    type: object
  model.AlertGroup:
    properties:
      ack_processed_at:
        description: When ack update job was processed
        type: string
      acknowledged_by:
        description: Acknowledgement
        type: string
      alerts:
        description: Alerts Snapshot
        items:
          $ref: '#/definitions/model.Alert'
        type: array
      created_at:
        type: string
      current_step:
        type: integer
      dedup_key:
        description: groupKey from Alertmanager (fingerprint)
        type: string
      external_url:
        description: External Link to Alertmanager Source (for clickable titles)
        type: string
      id:
        description: UUID
        type: string
      incident_id:
        description: Link to future Incident (NULL in most cases for Phase 2)
        type: integer
      oncall_snapshot:
        allOf:
        - $ref: '#/definitions/model.OnCallResult'
        description: OnCall Snapshot (stores the on-call state at the time of alert
          group creation)
      policy_id:
        description: Escalation Logic
        type: string
      policy_snapshot:
        allOf:
        - $ref: '#/definitions/model.EscalationPolicySnapshot'
        description: Policy Snapshot (stores the policy state at the time of creation/assignment)
      resolved_at:
        type: string
      resolved_by:
        type: string
      severity:
        type: string
      slack_update_pending:
        description: Slack Update Tracking
        type: boolean
      status:
        $ref: '#/definitions/model.AlertGroupStatus'
      team_id:
        description: Classification
        type: string
      team_name_snapshot:
        type: string
      timeline_events:
        description: Timeline (loaded on demand, not persisted here)
        items:
          $ref: '#/definitions/model.TimelineEvent'
        type: array
      title:
        description: Derived from Alert Labels/Annotations
        type: string
      updated_at:
        type: string
    type: object
  model.AlertGroupStatus:
    enum:
    - new
    - processing
    - triggered
    - acknowledged
    - resolved
    - closed
    type: string
    x-enum-comments:
      AlertGroupStatusAcknowledged: User acknowledged, waiting for resolution
    x-enum-varnames:
    - AlertGroupStatusNew
    - AlertGroupStatusProcessing
    - AlertGroupStatusTriggered
    - AlertGroupStatusAcknowledged
    - AlertGroupStatusResolved
    - AlertGroupStatusClosed
  model.AlertStatus:
    enum:
    - firing
    - resolved
    type: string
    x-enum-varnames:
    - AlertStatusFiring
    - AlertStatusResolved
  model.EscalationPolicy:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      steps:
        items:
          $ref: '#/definitions/model.EscalationStep'
        type: array
      team_id:
        description: nil = global policy
        type: string
      updated_at:
        type: string
    type: object
  model.EscalationPolicySnapshot:
    properties:
      name:
        type: string
      policy_id:
        description: Effective policy ID (empty if firehose-only fallback)
        type: string
      steps:
        items:
          $ref: '#/definitions/model.EscalationStepSnapshot'
        type: array
    type: object
  model.EscalationStep:
    properties:
      continue_on_failure:
        type: boolean
      delay_seconds:
        type: integer
      id:
        type: string
      max_attempts:
        type: integer
      message:
        type: string
      policy_id:
        type: string
      provider:
        description: '"slack", "telegram", ...'
        type: string
      step_index:
        type: integer
      target_id:
        description: actual ID
        type: string
      target_kind:
        description: '"dm" | "channel"'
        type: string
      target_type:
        description: user, channel, schedule
        type: string
      timeout_seconds:
        type: integer
    type: object
  model.EscalationStepSnapshot:
    properties:
      is_firehose:
        description: true for firehose step
        type: boolean
      provider:
        type: string
      stage_index:
        description: which stage this step belongs to
        type: integer
      target_id:
        type: string
      target_kind:
        type: string
      target_type:
        type: string
    type: object
  model.ExternalIdentity:
    properties:
      chat_id:
        description: provider-specific (Telegram DM chat)
        type: string
      created_at:
        type: string
      display_name:
        description: shown in timeline / UI
        type: string
      external_id:
        type: string
      id:
        type: string
      provider:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  model.Integration:
    properties:
      config:
        type: object
      created_at:
        type: string
      direction:
        $ref: '#/definitions/model.IntegrationDirection'
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      scope:
        $ref: '#/definitions/model.WebhookScope'
      team_id:
        type: string
      type:
        $ref: '#/definitions/model.IntegrationType'
      updated_at:
        type: string
    type: object
  model.IntegrationDirection:
    enum:
    - inbound
    - outbound
    type: string
    x-enum-varnames:
    - IntegrationDirectionInbound
    - IntegrationDirectionOutbound
  model.IntegrationType:
    enum:
    - slack
    - telegram
    - alertmanager_webhook
    - generic_webhook
    type: string
    x-enum-varnames:
    - IntegrationTypeSlack
    - IntegrationTypeTelegram
    - IntegrationTypeAlertmanagerWebhook
    - IntegrationTypeGenericWebhook
  model.OnCallResult:
    properties:
      l1_since:
        description: When L1 shift started
        type: string
      l1_until:
        description: When L1 shift ends. nil = forever/unknown
        type: string
      l1_users:
        items:
          $ref: '#/definitions/model.User'
        type: array
      l2_user:
        $ref: '#/definitions/model.User'
      source:
        description: |-
          Source is "rotation" or "override": what put L1Users on duty. The
          projection overlays an override onto the layer, so L1Users already names
          whoever is really on call - Source is what keeps the fact that they are
          standing in from being lost, now that there is no legacy override row to
          point at. Empty on snapshots written before it existed.
        type: string
    type: object
  model.Team:
    properties:
      created_at:
        type: string
      default_policy_id:
        description: Fallback escalation policy
        type: string
      description:
        description: Optional description
        type: string
      id:
        description: e.g., "devops"
        type: string
      name:
        description: 'Display name: "DevOps Team"'
        type: string
      severity_routes:
        additionalProperties:
          type: string
        description: severity -> policy_id
        type: object
    type: object
  model.TeamMember:
    properties:
      role:
        $ref: '#/definitions/model.TeamMemberRole'
      team_id:
        type: string
      user_id:
        type: string
    type: object
  model.TeamMemberDetail:
    properties:
      auth_provider:
        description: '"password" or "oidc" - last login method'
        type: string
      created_at:
        type: string
      email:
        description: Unique email
        type: string
      id:
        description: UUID
        type: string
      identities:
        description: loaded on demand by handlers
        items:
          $ref: '#/definitions/model.ExternalIdentity'
        type: array
      name:
        description: Display name
        type: string
      role:
        allOf:
        - $ref: '#/definitions/model.UserRole'
        description: 'Global role: admin or user'
      team_role:
        allOf:
        - $ref: '#/definitions/model.TeamMemberRole'
        description: '"team_admin" or "team_member"'
    type: object
  model.TeamMemberRole:
    enum:
    - team_admin
    - team_member
    type: string
    x-enum-comments:
      TeamMemberRoleAdmin: Team administrator
      TeamMemberRoleMember: Regular team member
    x-enum-varnames:
    - TeamMemberRoleAdmin
    - TeamMemberRoleMember
  model.TimelineEvent:
    properties:
      actor:
        description: User ID, "system", or alert name
        type: string
      alert_group_id:
        description: Changed from incident_id
        type: string
      created_at:
        type: string
      id:
        type: string
      message:
        description: Human-readable description
        type: string
      metadata:
        additionalProperties:
          type: string
        description: Extra data (alert fingerprint, etc.)
        type: object
      type:
        $ref: '#/definitions/model.TimelineEventType'
    type: object
  model.TimelineEventType:
    enum:
    - created
    - alert_added
    - alert_resolved
    - acknowledged
    - resolved
    - notification_sent
    - notification_failed
    - note
    - status_change
    type: string
    x-enum-varnames:
    - TimelineEventCreated
    - TimelineEventAlertAdded
    - TimelineEventAlertResolved
    - TimelineEventAcknowledged
    - TimelineEventResolved
    - TimelineEventNotificationSent
    - TimelineEventNotificationFailed
    - TimelineEventNote
    - TimelineEventStatusChange
  model.User:
    properties:
      auth_provider:
        description: '"password" or "oidc" - last login method'
